<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Syntax</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f7fb;
      background: #0b0d12;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .bg {
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(circle at 15% 10%, rgba(96,140,255,0.45), transparent 42%),
        radial-gradient(circle at 85% 15%, rgba(255,96,180,0.28), transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(0,220,180,0.25), transparent 45%),
        #0b0d12;
    }
    .sheet {
      position: absolute; inset: 14px;
      display: flex; flex-direction: column;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(20,24,34,0.55);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      backdrop-filter: blur(26px) saturate(180%);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.18);
      overflow: hidden;
    }
    .head {
      padding: 16px 22px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      flex: 0 0 auto;
    }
    .dots { display: flex; gap: 6px; margin-bottom: 10px; }
    .dots span { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dots .r { background: #ff5f57; }
    .dots .y { background: #febc2e; }
    .dots .g { background: #28c840; }
    .head h1 { margin: 0; font-size: 18px; letter-spacing: 0.4px; color: #ffffff; }
    .head p { margin: 6px 0 0; font-size: 12px; color: rgba(245,247,251,0.62); }
    .content {
      flex: 1; overflow: auto;
      padding: 4px 22px 26px;
      line-height: 1.7;
      font-size: 13px;
      user-select: text;
    }
    .content h2 {
      font-size: 14px; margin: 22px 0 8px;
      color: #9fc4ff; letter-spacing: 0.3px;
    }
    .content h2:first-child { margin-top: 16px; }
    .content p { margin: 0 0 10px; color: rgba(245,247,251,0.86); }
    .content ul { margin: 0 0 10px; padding-left: 20px; color: rgba(245,247,251,0.86); }
    .content li { margin: 3px 0; }
    .content pre {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(0,0,0,0.34);
      font-family: Consolas, "Courier New", monospace;
      font-size: 12.5px;
      color: #dce9ff;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .content .note { color: #ffd48a; font-size: 12px; }
    .content::-webkit-scrollbar { width: 10px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    .content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); background-clip: content-box; }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="sheet">
    <header class="head">
      <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
      <h1 id="syntaxTitle">语法规范</h1>
      <p>只读窗口 · 所有指令都在主窗口输入 / Read-only · type commands in the main window</p>
    </header>
    <main id="content" class="content"></main>
  </div>
  <script src="syntax.js"></script>
  <script src="syntax-view.js"></script>
</body>
</html>
